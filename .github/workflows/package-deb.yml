name: Build Linux Package

# 只做一件事：构建 Linux 安装包（.deb）并把产物上传到本次运行的 Artifacts。
#   * 不创建 Release、不创建 PR；
#   * 推送任意分支、打 tag、提 PR 或手动触发（Actions → Run workflow）都会执行；
#   * 构建完成后在 Actions 页面该次运行的最下方下载 spark-store_*.deb。
#
# 如需同时构建别的发行版，往 matrix.include 里加一行即可（例如 debian:12 容器）。

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deb:
    name: Build .deb (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # DTK 5.5.x + Qt 5.15.3，与项目 debian/control 里声明的依赖一致
          - name: ubuntu-22.04
            runner: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # src/spark-store.pro 里用 `git symbolic-ref --short -q HEAD` 取分支名写入版本号
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          # libdtkcore-dev / libdtkgui-dev / libdtkwidget-dev 在 Ubuntu 的 universe 源里
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates debhelper devscripts dh-make dpkg-dev fakeroot pkg-config \
            qtbase5-dev qtbase5-dev-tools qt5-qmake qtchooser qttools5-dev-tools \
            qtwebengine5-dev libqt5svg5-dev qtwayland5 \
            libdtkcore-dev libdtkgui-dev libdtkwidget-dev
          # 部分发行版把 qmake/moc/uic/lupdate 放在 /usr/lib/qt5/bin 下，补一下 PATH
          if ! command -v qmake >/dev/null 2>&1; then
            sudo ln -sf /usr/lib/qt5/bin/qmake /usr/local/bin/qmake
          fi
          qmake --version

      - name: Build deb package
        run: |
          set -eux
          export QT_SELECT=qt5
          export PATH="/usr/lib/qt5/bin:$PATH"
          # 并行度：debian/rules 里的 $(JOBS)；DEB_BUILD_OPTIONS 里的 parallel 供 dh 自身的步骤使用
          export JOBS="$(nproc)"
          export DEB_BUILD_OPTIONS="parallel=$(nproc) nocheck"

          # 构建过程会打印 Warning/Error，方便排查
          dpkg-buildpackage -b -us -uc

          mkdir -p dist
          cp -v ../*.deb dist/
          cp -v ../*.buildinfo dist/ || true
          ls -lh dist

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: spark-store-deb-${{ matrix.name }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.name }}
          path: |
            debian/*.debhelper.log
            debian/**/*.log
          if-no-files-found: ignore
          retention-days: 7
